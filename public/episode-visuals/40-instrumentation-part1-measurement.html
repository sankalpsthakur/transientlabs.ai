<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Instrumentation Part 1: Every Number Is an Opinion · interactive working principle</title><style>.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}

.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}

.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}

.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}

.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}

.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}

.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}

.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

:root{color-scheme:dark;--foreground:#f1f0ec;--card:#0b0d10;--muted:#242a33;--muted-foreground:#b8bcc5;--border:#46515e;--primary:var(--foreground);--primary-foreground:var(--card);--viz-series-1:#e8ad54;--viz-series-2:#48d3bd;--viz-series-3:#a791eb;--destructive:#f48b8b;--font-size-base:14px}
*{box-sizing:border-box}html{background:var(--card)}body{margin:0;padding:20px 20px 24px;background:var(--card);color:var(--foreground);font:400 14px/1.6 Arial,Helvetica,sans-serif}h2,h3{font-size:18px;font-weight:500;line-height:1.35;margin:0 0 14px}button,input,select{font:inherit}button,select{border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--foreground)}button{padding:9px 12px;min-height:44px}button[aria-pressed=true]{background:var(--foreground);color:var(--card)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:4px}select{padding:8px;min-height:44px;max-width:100%;width:100%}input[type=range]{width:100%;accent-color:var(--viz-series-1);min-height:28px;margin:0}a{color:var(--muted-foreground);text-decoration:underline;text-underline-offset:3px}a:hover{color:var(--foreground)}
.controls,.sensor-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 24px;margin:16px 0}.control,.form-label{display:grid;gap:8px}.control-heading{display:flex;justify-content:space-between;gap:10px}.control-heading output{color:var(--muted-foreground);font-variant-numeric:tabular-nums}svg.scene{display:block;width:100%;height:340px;margin:12px 0}svg text{font-family:Arial,Helvetica,sans-serif;font-weight:400}.readout{font-size:14px;font-variant-numeric:tabular-nums;margin:8px 0;color:var(--foreground)}.summary{font-size:13px;color:var(--muted-foreground);margin:8px 0}.sources{display:flex;flex-wrap:wrap;gap:5px 15px;margin-top:18px;font-size:12px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground);margin-bottom:10px}.viz-row,.viz-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.text-small{font-size:12px}.text-muted{color:var(--muted-foreground)}.form-range{display:block;width:100%}.tabular-nums{font-variant-numeric:tabular-nums}[hidden]{display:none!important}
@media(max-width:400px){body{padding:14px 12px 20px}.controls,.sensor-inputs{grid-template-columns:1fr}.control-heading{flex-wrap:wrap}h2,h3{font-size:17px}}

.hint{font-size:12px;color:var(--muted-foreground);margin:0 0 20px}.figure-frame{border:1px solid #29323c;border-radius:8px;background:radial-gradient(ellipse at 50% 30%,#171d25,transparent 70%);padding:8px 12px 14px;margin:24px 0}.figure-frame .readout{border-top:1px solid #29323c;padding:15px 8px 0;margin:0;font-size:13px;line-height:1.7}.sources{border-top:1px solid #29323c;padding-top:16px}.summary{line-height:1.8}.tour{margin-top:6px;width:max-content}.scene{contain:layout style}body{padding:24px}h2{font-size:21px;letter-spacing:-.02em;font-weight:600}input[type=range]{min-height:44px}.controls{margin:20px 0}.figure-frame svg.scene{margin:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

</style></head><body><div id="temperature-micro-view">
  <h3>RTD &amp; thermocouple: what changes inside?</h3>
  <div class="viz-controls"><button type="button" class="btn" data-sensor="rtd" aria-pressed="true">RTD · electron scattering</button><button type="button" class="btn" data-sensor="tc" aria-pressed="false">Thermocouple · Seebeck effect</button></div>
  <div class="sensor-inputs">
    <label class="form-label">Sensor temperature <output class="tabular-nums" data-hot-value>100 °C</output><input class="form-range" data-hot type="range" min="0" max="200" step="1" value="100" aria-label="Sensor temperature in degrees Celsius"></label>
    <label class="form-label" data-cold-label hidden>Terminal temperature <output class="tabular-nums" data-cold-value>25 °C</output><input class="form-range" data-cold type="range" min="0" max="80" step="1" value="25" aria-label="Terminal temperature in degrees Celsius"></label>
  </div>
  <svg class="sensor-scene" role="img" aria-label="Platinum lattice vibrations and resistance measurement"></svg>
  <div data-detail class="text-small" aria-live="polite"></div>
  <div class="text-small text-muted sensor-note">Microscopic marks are schematic; thermocouple numbers use an illustrative constant 40 µV/K thermopower difference.</div>
</div>
<style>
#temperature-micro-view{width:100%}#temperature-micro-view h3{margin:0 0 12px}#temperature-micro-view .sensor-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:16px}#temperature-micro-view .sensor-inputs label{display:grid;gap:8px}#temperature-micro-view output{margin-left:8px}#temperature-micro-view .sensor-scene{display:block;width:100%;height:365px;margin:8px 0}#temperature-micro-view svg text{fill:var(--foreground);font-family:inherit;font-size:12px;font-weight:400}#temperature-micro-view .sensor-note{margin-top:10px}#temperature-micro-view [hidden]{display:none!important}
</style>
<script>
(()=>{
const root=document.getElementById('temperature-micro-view'),svg=root.querySelector('svg'),hot=root.querySelector('[data-hot]'),cold=root.querySelector('[data-cold]'),buttons=[...root.querySelectorAll('[data-sensor]')];let mode='rtd';
const line=(d,c='var(--border)',w=1,extra='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
const text=(x,y,s,a='start')=>`<text x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
const dot=(x,y,r,c,more='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${more}/>`;
const arrow=(x1,y,x2,c)=>line(`M${x1} ${y}H${x2}`,c,2)+line(`M${x2+(x2>x1?-7:7)} ${y-5}L${x2} ${y}l${x2>x1?-7:7} 5`,c,2);
function draw(){const W=Math.max(280,root.clientWidth),T=+hot.value,C=+cold.value;let s='';root.querySelector('[data-hot-value]').value=T+' °C';root.querySelector('[data-cold-value]').value=C+' °C';root.querySelector('[data-cold-label]').hidden=mode!=='tc';svg.setAttribute('viewBox',`0 0 ${W} 365`);
if(mode==='rtd'){
const R=100*(1+.0039083*T-.0000005775*T*T),v=R;root.dataset.resistance=R.toFixed(4);
s+=text(W/2,23,'Platinum lattice · stronger thermal vibration','middle');
const cols=Math.max(5,Math.floor((W-70)/55)),dx=(W-80)/(cols-1),amp=3+T/32;
for(let row=0;row<3;row++)for(let col=0;col<cols;col++){const x=40+col*dx,y=66+row*53,a=(col*1.9+row*2.3),vx=Math.sin(a)*amp,vy=Math.cos(a)*amp;s+=dot(x,y,12+amp,'var(--viz-series-3)','opacity=".08"')+line(`M${x-amp} ${y}H${x+amp}`)+line(`M${x} ${y-amp}V${y+amp}`)+dot(x+vx,y+vy,8,'var(--muted)', 'stroke="var(--foreground)" stroke-width="1"');}
let d=`M16 113`,points=[];for(let i=0;i<cols*2;i++){let x=25+i*(W-50)/(cols*2-1),y=113+Math.sin(i*2.3)*(13+T/10);d+=`L${x} ${y}`;if(i%3===1)points.push([x,y]);}s+=line(d,'var(--viz-series-1)',2);points.forEach(([x,y])=>{s+=dot(x,y,6,'var(--viz-series-1)')+text(x,y+4,'−','middle');});s+=text(W/2,219,'Electron paths scatter off lattice vibrations','middle');
const cx=W/2,coilw=Math.min(136,W*.35),left=cx-coilw/2,right=cx+coilw/2;let coil=`M${left} 276`;for(let i=0;i<8;i++){let x=left+i*coilw/8;coil+=`L${x+coilw/32} 263L${x+coilw*3/32} 289L${x+coilw/8} 276`;}
s+=line(coil,'var(--foreground)',2)+line(`M22 250H${left}V276M${right} 276V250H${W-22}`,'var(--viz-series-1)',1.5)+line(`M22 310H${left}V276M${right} 276V310H${W-22}`,'var(--border)',1.5)+dot(left,276,3,'var(--foreground)')+dot(right,276,3,'var(--foreground)')+text(22,242,'1 mA in')+text(W-22,242,'1 mA out', 'end')+text(cx,307,'Pt100 · '+R.toFixed(2)+' Ω', 'middle')+text(cx,344,'Voltage sensed: '+v.toFixed(2)+' mV','middle');
root.querySelector('[data-detail]').textContent='Heat increases electron–phonon scattering. With a known current, the measured voltage reveals resistance and temperature.';
svg.setAttribute('aria-label',`Pt100 at ${T} degrees Celsius: resistance ${R.toFixed(2)} ohms, voltage ${v.toFixed(2)} millivolts with 1 milliampere excitation. Four-wire sensing separates drive and voltage leads.`);
}else{
const V=.04*(T-C),x0=42,x1=W-39,ym=173;root.dataset.voltage=V.toFixed(4);
s+=text(18,25,'Terminals: '+C+' °C')+text(W-18,25,'Junction: '+T+' °C','end');
s+=line(`M${x0} 136H${x1}V210H${x0}`,'var(--border)',22)+line(`M${x0} 136H${x1}`,'var(--viz-series-1)',9)+line(`M${x0} 210H${x1}`,'var(--viz-series-2)',9)+dot(x1,ym,11,'var(--muted)','stroke="var(--foreground)" stroke-width="1.5"')+text(W/2,104,'Alloy A','middle')+text(W/2,246,'Alloy B','middle');
for(let i=0;i<7;i++){let x=x0+15+i*(x1-x0-30)/6,heat=C+(T-C)*(x-x0)/(x1-x0),r=3.5+Math.max(0,heat)/80;s+=dot(x,136,r,'var(--card)','opacity=".9"')+dot(x,210,r*.8,'var(--card)','opacity=".9"');}
s+=text(W/2,60,'Different alloys → different thermopowers','middle');
if(T!==C){const dir=T>C?-1:1,len=Math.min(62,(W-125)/3);s+=arrow(W*.5-dir*len/2,163,W*.5+dir*len/2,'var(--viz-series-1)')+arrow(W*.5-dir*len/3,183,W*.5+dir*len/3,'var(--viz-series-2)');}else s+=text(W/2,180,'No temperature gradient','middle');
s+=line(`M${x0} 136H18V${ym-16}M${x0} 210H18V${ym+16}`,'var(--foreground)',1.5)+dot(18,ym,16,'var(--card)','stroke="var(--foreground)" stroke-width="1.2"')+text(18,ym+4,'V','middle');
s+=text(W/2,281,'Open-circuit voltage: '+V.toFixed(2)+' mV','middle')+text(W/2,308,'Reference temperature → hot-end reading','middle')+text(W/2,341,'Thermal drive balanced by an electric field','middle');
root.querySelector('[data-detail]').textContent='A temperature gradient creates different thermoelectric voltages along the two alloys. Their difference is measured without an excitation current.';
svg.setAttribute('aria-label',`Illustrative thermocouple: junction ${T} degrees Celsius, terminals ${C} degrees Celsius, open-circuit voltage ${V.toFixed(2)} millivolts. Carriers respond differently in the two alloys; arrow lengths are conceptual, not currents.`);
}
svg.innerHTML=s;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sensor===mode)));root.querySelector('.sensor-note').textContent=mode==='tc'?'Carrier marks and arrows are schematic; numbers use an illustrative constant thermopower difference of 40 µV/K.':'Lattice and electron paths are schematic. Readout: nominal Pt100 curve with 1 mA excitation and four-wire sensing.';root.dataset.sensor=mode;
}
buttons.forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.sensor;draw();}));hot.addEventListener('input',draw);cold.addEventListener('input',draw);new ResizeObserver(draw).observe(root);draw();
})();
</script>
<div class="sources"><a href="https://www.nist.gov/pml/sensor-science/thermodynamic-metrology/mercury-thermometer-alternatives/mercury-thermometer-1" target="_blank" rel="noopener noreferrer">NIST · platinum resistance thermometers</a><a href="https://www.nist.gov/pml/sensor-science/thermodynamic-metrology/mercury-thermometer-alternatives/mercury-thermometer-5" target="_blank" rel="noopener noreferrer">NIST · thermocouples</a></div><script>(()=>{const notify=()=>parent.postMessage({type:'deep-end-visual-height',episode:40,height:Math.ceil(document.body.getBoundingClientRect().height)},'*');new ResizeObserver(notify).observe(document.body);notify();})();</script></body></html>
