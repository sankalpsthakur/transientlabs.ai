</style></head><body><main class="iso" id="deep-end-model" data-episode="36"><p class="eyebrow">Fig 36 · Working principle</p><h2 data-title></h2><p class="hint">Change a control to see the mechanism respond. Arrow keys work on sliders.</p><div class="controls" data-controls></div><div class="figure-frame"><svg class="scene" role="img" aria-label="Interactive scientific working principle"></svg><div class="readout" data-readout></div></div><p class="summary" data-summary></p><div class="sources" data-sources></div></main><script>(() => {
  const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const colors = {ink:'var(--foreground)',muted:'var(--muted-foreground)',line:'var(--border)',surface:'var(--muted)',paper:'var(--card)',accent:'var(--viz-series-1)',secondary:'var(--viz-series-2)',tertiary:'var(--viz-series-3)',danger:'var(--destructive)'};
  const color = tone => colors[tone] || tone;
  // Keep white labels readable on solid marks, while paths retain bright series colors.
  const solid = {accent:'#866024',secondary:'#246c60',tertiary:'#655388',danger:'#8e4a4a'};
  const fill = (tone,o={}) => solid[tone] && (o.opacity===undefined || o.opacity>=.6) ? solid[tone] : color(tone);
  const finite = value => {
    if (!Number.isFinite(+value)) throw new Error('Non-finite visual coordinate');
    return +value;
  };
  const options = value => {
    let attributes='';
    if(value.opacity!==undefined)attributes+=` opacity="${finite(value.opacity)}"`;
    if(value.stroke)attributes+=` stroke="${color(value.stroke)}" stroke-width="${finite(value.strokeWidth??1)}"`;
    if(value.dash)attributes+=` stroke-dasharray="${esc(value.dash)}"`;
    return attributes;
  };
  window.DeepEndHelpers = (W,H=340) => {
    const path=(d,tone='line',width=1,o={})=>`<path d="${esc(d)}" fill="${o.fill?color(o.fill):'none'}" stroke="${color(tone)}" stroke-width="${finite(width)}" stroke-linecap="round" stroke-linejoin="round"${options({...o,stroke:undefined})}/>`;
    const line=(x1,y1,x2,y2,tone='line',width=1,o={})=>path(`M${finite(x1)} ${finite(y1)}L${finite(x2)} ${finite(y2)}`,tone,width,o);
    const rect=(x,y,w,h,tone='surface',o={})=>`<rect x="${finite(x)}" y="${finite(y)}" width="${Math.max(0,finite(w))}" height="${Math.max(0,finite(h))}" rx="${finite(o.radius??3)}" fill="${fill(tone,o)}"${options(o)}/>`;
    const circle=(x,y,r,tone='ink',o={})=>`<circle cx="${finite(x)}" cy="${finite(y)}" r="${Math.max(0,finite(r))}" fill="${r>=10?fill(tone,o):color(tone)}"${options(o)}/>`;
    const poly=(points,tone='surface',o={})=>`<polygon points="${points.map(p=>p.map(finite).join(',')).join(' ')}" fill="${color(tone)}"${options(o)}/>`;
    const text=(x,y,label,anchor='start',o={})=>{
      const size=o.size===14?14:12;
      const available=anchor==='middle'?Math.min(x-12,W-x-12)*2:anchor==='end'?x-12:W-x-12;
      const limit=Math.max(35,Math.min(o.maxWidth??available,available));
      const maxChars=Math.max(5,Math.floor(limit/(size*.54)));
      const words=String(label).split(/\s+/),lines=[];let current='';
      for(const word of words){if(current&&(current+' '+word).length>maxChars){lines.push(current);current=word;}else current+=(current?' ':'')+word;}if(current)lines.push(current);
      const baseline=Math.max(size+3,Math.min(y,H-5-(lines.length-1)*16));
      return `<text x="${finite(x)}" y="${finite(baseline)}" text-anchor="${esc(anchor)}" fill="${color(o.muted?'muted':'ink')}" font-size="${size}"${options(o)}>${lines.map((l,i)=>`<tspan x="${finite(x)}" dy="${i?16:0}">${esc(l)}</tspan>`).join('')}</text>`;
    };
    const arrow=(x1,y1,x2,y2,tone='accent',width=1.5,o={})=>{
      const angle=Math.atan2(y2-y1,x2-x1),a=7;
      return line(x1,y1,x2,y2,tone,width,o)+path(`M${x2-a*Math.cos(angle-.45)} ${y2-a*Math.sin(angle-.45)}L${x2} ${y2}L${x2-a*Math.cos(angle+.45)} ${y2-a*Math.sin(angle+.45)}`,tone,width,o);
    };
    return {W,H,esc,color,path,line,rect,circle,poly,text,arrow,clamp:(v,min,max)=>Math.max(min,Math.min(max,v))};
  };
})();
</script><script>/* Deep End Era: bounded educational models. Each draw is pure. */
(()=>{
  'use strict';
  const M=window.DeepEndModels=window.DeepEndModels||{};
  const range=(key,label,min,max,value,unit='',step=1)=>({key,label,min,max,step,value,unit});
  const select=(key,label,value,options)=>({key,label,type:'select',value,options:options.map(([value,label])=>({value,label}))});
  const source=(label,url)=>({label,url});
  const num=(v,d=1)=>Number(v).toFixed(d);
  const row=(c,y,label)=>c.text(18,y,label,'start',{muted:true});
  const tile=(c,x,y,w,h,label,tone='surface')=>c.rect(x,y,w,h,tone,{stroke:'line'})+c.text(x+w/2,y+h/2+4,label,'middle');

  M[1]={title:'When a replicated write becomes committed',
    controls:[range('reachable','Replicas reachable from leader',1,5,3),select('read','Read policy','quorum',[['quorum','Quorum-confirmed'],['local','Local follower']])],

    draw(c,s){

      svg+=row(c,27,'One command, five logs');
      for(let i=0;i<5;i++){
        const x=20+i*cw+(cw-entryW)/2;
        svg+=c.text(x+entryW/2,57,i===0?'Leader':`R${i+1}`,'middle');
        for(let j=0;j<4;j++) svg+=tile(c,x,75+j*36,entryW,27,`${j+1}`,'surface');
        svg+=c.rect(x,222,entryW,31,i<n?(committed?'accent':'secondary'):'surface',{stroke:i<n?'ink':'line'});
        svg+=c.text(x+entryW/2,242,i<n?'5':'—','middle');
        svg+=c.text(x+entryW/2,279,i<n?'ACK':'cut','middle',{muted:true});
      }
      const rx=20+4*cw+cw/2;
      svg+=c.line(20,committed?260:217,c.W-20,committed?260:217,'secondary',1.5,{dash:'4 3'});
      if(local)svg+=c.circle(rx,303,6,n===5?'accent':'secondary');
      svg+=c.text(c.W/2,328,committed?'Entry 5 crosses the commit boundary':'Entry 5 remains uncommitted','middle',{maxWidth:c.W-32});
      return{svg,readout:`${n}/5 ACKs · ${committed?'majority committed':'need 3 to commit'} · ${local?`R5 returns ${n===5&&committed?'5':'4'}`:committed?'confirmed read: 5':'confirmed read waits'}`,summary:'Illustrative current-term write in a five-replica Raft log. A majority commits it; a local follower may still show the old value. Quorum-confirmed reads include the necessary leadership confirmation.'};
    }};

  M[3]={title:'A packet meets the OT boundary',
    controls:[select('packet','Packet direction','telemetry',[['telemetry','Telemetry outward'],['command','Command inward']]),select('gate','Boundary','diode',[['diode','Physical one-way link'],['firewall','Read-only firewall policy']])],
    sources:[source('NIST SP 800-82r3: OT segmentation and unidirectional gateways','https://csrc.nist.gov/pubs/sp/800/82/r3/final')],
    draw(c,s){
      const cx=c.W/2,y=173,out=s.packet==='telemetry',diode=s.gate==='diode',allowed=out;let svg='';
      svg+=c.rect(18,45,cx-31,233,'surface')+c.rect(cx+13,45,cx-31,233,'surface');
      svg+=c.text(cx/2,72,'Control zone','middle')+c.text(cx+cx/2,72,'Data zone','middle');
      const ly=out?127:223,from=out?36:c.W-36,to=out?c.W-36:36;
      svg+=c.line(from,ly,to,ly,'line',2,{dash:'4 4'});
      svg+=c.rect(cx-9,93,18,147,'paper',{stroke:'ink'});
      svg+=diode?c.poly([[cx-6,147],[cx-6,173],[cx+8,160]],'accent'):c.rect(cx-5,143,10,34,'accent');
      const packetX=allowed?(out?cx+26:cx-68):(out?cx-68:cx+26);
      svg+=c.rect(packetX,ly-12,40,24,allowed?'accent':'danger',{radius:2});
      for(let i=1;i<4;i++)svg+=c.line(packetX+i*10,ly-10,packetX+i*10,ly+10,'paper');

      svg+=c.text(24+col/2,168,phase>=1?'type Q':'type pending','middle',{muted:true})+c.text(cx+12+col/2,168,phase>=2?`type ${rightType}`:'type pending','middle',{muted:true});
      svg+=c.line(24,203,c.W-24,203,checked?(accept?'accent':'danger'):'line',2);
      svg+=c.text(cx,235,`⟨${left}, ${right}⟩`,'middle',{size:14});
      svg+=c.text(cx,266,checked?missing?'cannot synthesize incomplete term':`inferred type Q ∧ ${rightType}`:'build a pair term','middle',{maxWidth:c.W-32});
      svg+=c.rect(24,289,c.W-48,31,checked?(accept?'accent':'danger'):'surface',{opacity:.25});svg+=c.text(cx,310,checked?accept?'Accepted: Q ∧ P':'Rejected against goal Q ∧ P':'Checker has not finished','middle',{maxWidth:c.W-60});
      return{svg,readout:checked?accept?'The constructed term matches the proposition':missing?'Missing proof: the goal is not filled':'Type mismatch: Q ∧ Q is not Q ∧ P':`Step ${phase}/3 · ${['read assumption','check first projection','check second projection'][phase]}`,summary:'A small illustrative conjunction checker, not a running Lean kernel. h.right proves Q; h.left proves P; pairing them proves Q∧P. Swapping a projection or leaving a hole prevents this term from proving the requested proposition. Proof checking establishes the encoded claim, not that every real-world assumption is correct.'};
    }};
})();
</script><script>(() => {
  const root=document.getElementById('deep-end-model');
  const model=window.DeepEndModels[Number(root.dataset.episode)];
  if(!model)throw new Error('Missing episode visual: '+root.dataset.episode);
  const title=root.querySelector('[data-title]'),controls=root.querySelector('[data-controls]'),scene=root.querySelector('svg'),readout=root.querySelector('[data-readout]'),summary=root.querySelector('[data-summary]'),sources=root.querySelector('[data-sources]');
  title.textContent=model.title;
  const state={},outputs={};let timer=0,step=1,playing=false,announceTimer=0;
  const still=matchMedia('(prefers-reduced-motion: reduce)');
  const live=document.createElement('p');live.className='sr-only';live.setAttribute('aria-live','polite');root.append(live);
  const stop=()=>{clearTimeout(timer);playing=false;if(tour)tour.textContent='Play sequence';};
  let tour=null;
  for(const control of model.controls||[]){
    state[control.key]=control.value;
    const label=document.createElement('label');label.className='control';
    const heading=document.createElement('span');heading.className='control-heading';heading.append(document.createTextNode(control.label));
    let input;
    if(control.type==='select'){
      input=document.createElement('select');
      for(const choice of control.options){const option=document.createElement('option');option.value=choice.value;option.textContent=choice.label;input.append(option);}
      input.value=control.value;
    }else{
      const output=document.createElement('output');outputs[control.key]=output;heading.append(output);
      input=document.createElement('input');input.type='range';input.min=control.min;input.max=control.max;input.step=control.step??1;input.value=control.value;
    }
    input.setAttribute('aria-label',control.label);input.dataset.control=control.key;
    input.addEventListener('input',()=>{stop();state[control.key]=control.type==='select'?input.value:Number(input.value);draw();});
    label.append(heading,input);controls.append(label);
  }
  const first=(model.controls||[]).find(c=>c.type!=='select');
  if(first){
    tour=document.createElement('button');tour.type='button';tour.className='tour';tour.textContent='Play sequence';tour.disabled=still.matches;
    tour.title=still.matches?'Motion is disabled by your reduced-motion preference':'Step through the first control at a calm pace';
    tour.addEventListener('click',()=>{if(playing){stop();return;}playing=true;tour.textContent='Pause sequence';tick();});controls.append(tour);
    function tick(){if(!playing||document.hidden)return;const delta=(first.step??1)*Math.max(1,Math.round((first.max-first.min)/(first.step??1)/16));
      let next=Number(state[first.key])+delta*step;if(next>first.max||next<first.min){step*=-1;next=Math.max(first.min,Math.min(first.max,Number(state[first.key])+delta*step));}
      state[first.key]=Number(next.toFixed(6));root.querySelector(`[data-control="${first.key}"]`).value=state[first.key];draw();timer=setTimeout(tick,900);
    }
    new IntersectionObserver(entries=>{if(!entries[0].isIntersecting)stop();}).observe(root);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
    still.addEventListener('change',()=>{stop();tour.disabled=still.matches;});
  }
  for(const source of model.sources||[]){const link=document.createElement('a');link.href=source.url;link.textContent=source.label;link.target='_blank';link.rel='noopener noreferrer';sources.append(link);}
  function notify(){parent.postMessage({type:'deep-end-visual-height',episode:Number(root.dataset.episode),height:Math.ceil(document.body.getBoundingClientRect().height)},'*');}
  function draw(){
    const W=Math.max(280,Math.round(scene.getBoundingClientRect().width));
    const rendered=model.draw(window.DeepEndHelpers(W),state);
    scene.setAttribute('viewBox',`0 0 ${W} 340`);scene.innerHTML=rendered.svg;
    scene.setAttribute('aria-label',rendered.summary);readout.textContent=rendered.readout;summary.textContent=rendered.summary;
    clearTimeout(announceTimer);announceTimer=setTimeout(()=>{live.textContent=rendered.readout;},700);
    for(const control of model.controls||[]){if(outputs[control.key])outputs[control.key].textContent=String(state[control.key])+(control.unit?' '+control.unit:'');}
    root.dataset.state=JSON.stringify(state);notify();
  }
  new ResizeObserver(draw).observe(root);new ResizeObserver(notify).observe(document.body);draw();
  window.DeepEndVisual={state:()=>({...state}),draw,episode:Number(root.dataset.episode)};
})();
